<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transparent Auto</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{width:min(420px,90vw);text-align:center;padding:34px 22px;background:#1b1b1b;border-radius:24px;box-sizing:border-box}
.logo{width:200px;height:auto;margin:0 auto 16px;display:block}
p{color:#bbb;margin:0 0 24px}
a{display:block;text-decoration:none;background:#fff;color:#111;padding:16px;border-radius:12px;margin:12px 0;font-weight:700}
/* QR-specific styles to keep the QR image compact and centered */
a.qr{display:block;margin:12px auto;width:fit-content;background:transparent;padding:0}
a.qr img{display:block;width:120px;height:120px;border-radius:12px;background:#fff;padding:8px}
</style>

<div class="card">
<svg class="logo" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background shield shape -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d7a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield background -->
  <path d="M 200 20 L 320 80 L 320 160 Q 200 240 200 240 Q 80 160 80 80 Z" fill="url(#blueGrad)" stroke="#000" stroke-width="2"/>
  
  <!-- White border accent -->
  <path d="M 200 30 L 310 85 L 310 160 Q 200 230 200 230 Q 90 160 90 85 Z" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  
  <!-- Car body -->
  <ellipse cx="155" cy="130" rx="45" ry="30" fill="#0099ff" stroke="#000" stroke-width="2"/>
  <rect x="130" y="125" width="50" height="20" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
  
  <!-- Car wheels -->
  <circle cx="135" cy="158" r="10" fill="#333" stroke="#000" stroke-width="1"/>
  <circle cx="175" cy="158" r="10" fill="#333" stroke="#000" stroke-width="1"/>
  
  <!-- Wrench -->
  <g transform="translate(90, 100)">
    <rect x="0" y="10" width="8" height="40" rx="4" fill="#999" stroke="#000" stroke-width="1.5"/>
    <circle cx="4" cy="15" r="8" fill="#999" stroke="#000" stroke-width="1.5"/>
    <rect x="25" y="8" width="22" height="12" rx="4" fill="#999" stroke="#000" stroke-width="1.5"/>
  </g>
  
  <!-- Gear -->
  <g transform="translate(95, 60)">
    <circle cx="0" cy="0" r="12" fill="#666" stroke="#000" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#1b1b1b"/>
    <rect x="-2" y="-16" width="4" height="4" fill="#666" stroke="#000" stroke-width="1"/>
    <rect x="11" y="-8" width="4" height="4" fill="#666" stroke="#000" stroke-width="1"/>
    <rect x="11" y="4" width="4" height="4" fill="#666" stroke="#000" stroke-width="1"/>
    <rect x="-2" y="12" width="4" height="4" fill="#666" stroke="#000" stroke-width="1"/>
    <rect x="-15" y="4" width="4" height="4" fill="#666" stroke="#000" stroke-width="1"/>
    <rect x="-15" y="-8" width="4" height="4" fill="#666" stroke="#000" stroke-width="1"/>
  </g>
  
  <!-- Magnifying glass -->
  <g transform="translate(240, 80)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#000" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#0099ff" stroke-width="1.5"/>
    <line x1="14" y1="14" x2="26" y2="26" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="26" y2="26" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Text: TRANSPARENT -->
  <text x="200" y="260" font-size="32" font-weight="bold" text-anchor="middle" fill="#0099ff" stroke="#000" stroke-width="0.5" font-family="Arial, sans-serif">TRANSPARENT</text>
  
  <!-- Text: AUTO REPAIR -->
  <text x="200" y="285" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff" stroke="#000" stroke-width="0.3" font-family="Arial, sans-serif">AUTO REPAIR</text>
</svg>

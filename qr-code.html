<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transparent Auto - QR Code</title>
<style>
body{margin:0;padding:20px;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#fff}
.qr-container{text-align:center;padding:40px;background:#fff;border-radius:8px}
h2{margin:0 0 20px;font-size:24px;color:#111}
.qr-image{margin:20px 0}
.qr-image img{width:400px;height:400px;border:2px solid #111}
.footer{margin-top:20px;color:#666;font-size:12px}
@media print{body{margin:0;padding:0}.qr-container{border:none;box-shadow:none}}
</style>
</head>
<body>
<div class="qr-container">
<h2>Transparent Auto</h2>
<p>Mobile Mechanic Services</p>
<div class="qr-image">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://transparentautorepair-spec.github.io/transparentauto/" alt="QR Code">
</div>
<div class="footer">
<p>Scan to visit: transparentautorepair-spec.github.io/transparentauto</p>
<p>Call: (954) 853-2685</p>
</div>
</div>
<script>
window.addEventListener('load', function() {
  window.print();
});
</script>
</body>
</html>
